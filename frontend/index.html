<!DOCTYPE html>
<!--
  The .dark class is applied at the HTML root so the app renders in dark
  mode by default. LocalMind is a dark-only app — the light theme variables
  in globals.css are kept for future theming support but are not currently
  activated. shadcn/ui components use `dark:` variants that require this
  class to be present on a parent element.
-->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalMind</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
