<!DOCTYPE html>
<!--
  LocalMind ships five palettes (graphite-blue | graphite | iris | warm |
  custom) in light and dark (multi-palette; the earlier dark-only decision
  was reversed). The inline script below applies the user's stored choice to
  <html> before first paint so there is no theme flash; useTheme.ts is the
  runtime source of truth. Default = Graphite Blue dark.
-->
<html lang="en" data-theme="graphite-blue" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalMind</title>
    <script>
      (function () {
        try {
          var el = document.documentElement;
          var raw = localStorage.getItem('localmind-theme');
          var s = raw ? JSON.parse(raw) : null;
          var theme = s && ['graphite-blue', 'graphite', 'iris', 'warm', 'custom'].indexOf(s.theme) >= 0 ? s.theme : 'graphite-blue';
          var mode = s && ['light', 'dark', 'system'].indexOf(s.mode) >= 0 ? s.mode : 'dark';
          if (mode === 'system') {
            mode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          el.setAttribute('data-theme', theme);
          el.setAttribute('data-mode', mode);
          // Custom palette + tone — apply before first paint
          // so a saved custom theme doesn't flash the default.
          if (theme === 'custom' && s.custom && s.custom.accent && s.custom.background && s.custom.surface && s.custom.text) {
            el.style.setProperty('--acc', s.custom.accent);
            el.style.setProperty('--s-base', s.custom.background);
            el.style.setProperty('--s-1', s.custom.surface);
            el.style.setProperty('--s-2', s.custom.surface);
            el.style.setProperty('--t-primary', s.custom.text);
          }
          if (typeof s.tone === 'number' && s.tone >= 0.5 && s.tone <= 1.5) {
            el.style.setProperty('--ui-tone', String(s.tone));
          }
        } catch (e) {
          /* keep the html defaults */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Shown until the app mounts (React replaces #root's children). If the app never mounts
           - a script failed to load or crashed at startup - the watchdog below says so instead of
           leaving a blank window. -->
      <div id="boot" style="display:flex;height:100vh;align-items:center;justify-content:center;flex-direction:column;gap:14px;font:13px system-ui,sans-serif;color:#a2a6ad;background:#151517">
        <style>@keyframes lm-pulse{0%,100%{box-shadow:0 0 0 0 rgba(86,134,254,.22)}50%{box-shadow:0 0 0 14px rgba(86,134,254,0)}}</style>
        <div style="width:56px;height:56px;border-radius:16px;border:1px solid rgba(255,255,255,.12);background:linear-gradient(135deg,rgba(86,134,254,.16),rgba(86,134,254,.04));display:flex;align-items:center;justify-content:center;animation:lm-pulse 1.8s ease-in-out infinite">
          <div style="width:22px;height:22px;border:2px solid #7aaaff;border-radius:6px;opacity:.9"></div>
        </div>
        <div style="font-weight:600;letter-spacing:.02em;color:#f4f5f7">LocalMind</div>
        <div id="boot-msg">Starting…</div>
      </div>
    </div>
    <script>
      setTimeout(function () {
        var boot = document.getElementById('boot');
        if (!boot) return; // the app mounted
        var msg = document.getElementById('boot-msg');
        msg.innerHTML = 'The interface did not start. <a href="#" onclick="location.reload();return false" style="color:#7aaaff">Reload</a>';
      }, 10000);
      window.addEventListener('error', function (e) {
        var boot = document.getElementById('boot');
        var msg = document.getElementById('boot-msg');
        if (boot && msg) msg.textContent = 'The interface failed to start: ' + (e.message || 'unknown error');
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
