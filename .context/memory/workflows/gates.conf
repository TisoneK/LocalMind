# Gate command registry (project-owned; copy/update after bootstrap)
#
# Commands are executed from the project repository root by
# .context/core/bin/context-gates. Keep secrets out of this file.
#
# mode=hybrid means explicit commands below run first; when a gate has no
# explicit project commands, the helper discovers conventional package.json
# scripts or Python checks. Set mode=explicit to fail when a gate has no
# configured project command.
mode=hybrid

# One command per line: <gate>|<command>
# Gates: checkpoint, pre-commit, integration, exit
# (Session 296) Project commands, run from the repo root:

# pre-commit — fast, before every commit (the full suite runs at exit + the
# existing .pre-commit-config.yaml git hook).
pre-commit|cd frontend && npx tsc -b --noEmit
pre-commit|backend/.venv/bin/ruff check backend/src
# (B-2026-09-06-11) Unresolved merge-conflict markers in memory files must
# never commit again (they shipped once inside a merge's resolved content).
pre-commit|sh scripts/check-conflict-markers.sh

# exit — the canonical CI (ruff + pytest + tsc + eslint) MUST pass, and the
# append-only inefficiencies/flaws logs must be current with sessions.md
# (closes the S296 bookkeeping-drift flaw: the gate now fails if they're stale).
exit|sh scripts/ci-check.sh
exit|sh scripts/check-bookkeeping.sh
