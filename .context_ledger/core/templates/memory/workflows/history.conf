# Session-group rotation config — read by ledger-history.
# Delete a line to use its default. Values must be positive integers.

# Sessions logged in the current group before a close is due.
group_size=20

# Rows the tasks/backlog.md work queue holds before ledger-mem check warns
# and the add-a-row/prune-one rule kicks in. The queue is a working set,
# not an archive — overflow goes to tasks/parking-lot.md, not a 21st row.
backlog_cap=20

# Entries flaws/log.md and inefficiencies/log.md each hold before
# ledger-mem check warns it's time to run `ledger-mem prune` (report) and
# `prune --apply` (moves closed entries to archive.md). Unlike the
# backlog, these are append-only logs — the cap is a hygiene nudge, not a
# hard limit; an unresolved entry never gets pruned regardless of count.
flaws_cap=15
inefficiencies_cap=15

# Closed groups kept readable in .context_ledger/history/ before the oldest is
# zipped into .context_ledger/archive/.
history_keep=3

# Tarballs kept in .context_ledger/archive/ before `ledger-history gc` deletes the
# oldest first, down to this cap (forced — archive/ cannot grow unbounded).
archive_keep=12
