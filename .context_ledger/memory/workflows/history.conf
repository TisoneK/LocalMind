# Session-group rotation config — read by context-history.
# Delete a line to use its default. Values must be positive integers.

# Sessions logged in the current group before a close is due.
group_size=20

# Closed groups kept readable in .context/history/ before the oldest is
# zipped into .context/archive/.
history_keep=3

# Tarballs kept in .context/archive/ before `context-history gc` deletes the
# oldest first, down to this cap (forced — archive/ cannot grow unbounded).
archive_keep=12
