name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Ruff lint
        run: .venv/bin/ruff check .
        # TODO: make blocking once ruff errors are resolved (H1 follow-up).
        # Currently 116 errors remain (all E501 — long strings/prompts).
        continue-on-error: true

      - name: Pytest
        run: .venv/bin/pytest ../tests -q
        # All 194 tests pass after C7 fix. Blocking.

      - name: Mypy type check
        run: .venv/bin/mypy src
        continue-on-error: true

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc -b
        working-directory: frontend

      - name: ESLint
        run: npx eslint .
        working-directory: frontend
        # 0 errors, 48 warnings (intentional — any types, react-hooks patterns).
        # Warnings don't fail the build; errors would.

      - name: Vite build
        run: npx vite build
        working-directory: frontend
