[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localmind"
version = "0.5.0"
description = "Make local AI work like Claude — file reading, web search, memory, and tool use on top of Ollama"
readme = "../README.md"
license = { file = "../LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Tisone Kironget", email = "tisone@skytechsolutions.dev" }
]
keywords = ["ollama", "llm", "local-ai", "rag", "tool-use", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # API layer
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",

    # LLM communication
    "httpx>=0.27.0",

    # File parsing
    "pymupdf>=1.24.0",          # PDF
    "python-docx>=1.1.0",       # DOCX
    "pandas>=2.2.0",            # CSV / Excel
    "openpyxl>=3.1.0",          # Excel support for pandas

    # Web search
    "ddgs>=6.1.0",

    # Memory / Storage
    "sqlite-vec>=0.1.6",

    # Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # CLI
    "typer>=0.12.0",
    "rich>=13.7.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "platformdirs>=4.0",        # Platform-specific directories
    "aiofiles>=23.2.0",
    "tiktoken>=0.7.0",          # Token counting
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",            # For FastAPI test client
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
ocr = [
    "pillow>=10.0.0",           # Image processing
    "pytesseract>=0.3.10",      # OCR text extraction
    "transformers>=4.40.0",     # Vision models
    "torch>=2.3.0",             # PyTorch for vision models
]

[project.scripts]
localmind = "cli.main:app"

[project.urls]
Homepage = "https://github.com/TisoneK/localmind"
Repository = "https://github.com/TisoneK/localmind"
Issues = "https://github.com/TisoneK/localmind/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/tools", "src/adapters", "src/api", "src/storage", "src/cli"]

[tool.ruff]
# 120 chars: the codebase was written with ~120-char lines in mind.
# The original 100-char setting was aspirational (301 violations).
# 120 reduces to 116 (all genuinely long strings/prompts that can't be wrapped).
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
# N806: Function-scoped constants use _UPPER_CASE (sentinels, compiled regexes).
#       This is standard Python convention; ruff's N806 is too strict for it.
# N815: Pydantic API response models use camelCase to match frontend JSON field
#       names (tokensPerSecond, totalTokens). Renaming would break the API contract.
ignore = ["N806", "N815"]

[tool.ruff.lint.per-file-ignores]
# app.py: load_dotenv() must run before config imports (settings reads env at import time).
# loop.py: Late imports avoid circular dependencies in the agent package.
# db.py: Connection pool import placed near the perf comment that explains it.
# tools/__init__.py: Tool imports trigger registration side effects — order matters.
"src/api/app.py" = ["E402"]
"src/core/agent/loop.py" = ["E402"]
"src/storage/db.py" = ["E402"]
"src/tools/__init__.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests"]
pythonpath = ["src"]
# Use importlib mode to avoid package name conflicts between tests/tools/
# and backend/src/tools/ — both define a "tools" package, and the default
# prepend mode causes the test package to shadow the source package.
importmode = "importlib"
